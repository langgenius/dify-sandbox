services:
  fixture-check:
    build:
      context: ../..
      dockerfile: tests/conformance/fixture-check.dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 32
    tmpfs: [/tmp:size=16m]
  verifier:
    build:
      context: ../..
      dockerfile: tests/conformance/verifier.dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 32
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
    tmpfs: [/tmp:size=16m]
  unit:
    build:
      context: ../..
      dockerfile: tests/conformance/unit.dockerfile
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
  integration:
    build:
      context: ../..
      dockerfile: tests/conformance/integration.dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 16
    volumes:
      - observations:/observations:ro
      - qualification:/qualification:ro
    networks: [conformance]
  # Runtime qualification uses the reviewed dedicated systemd services in
  # fixture/, never a Docker-default privileged capability/profile shortcut.
volumes:
  observations:
  qualification:
networks:
  conformance:
    internal: true
