name: Builder actual-image conformance
on:
  workflow_call:
    inputs:
      candidate_index:
        type: string
        required: true
      source_revision:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      candidate_index:
        description: Immutable published index from the approved normal build
        required: true
      source_revision:
        description: Exact independently approved source commit
        required: true
permissions:
  contents: read
  attestations: read
  packages: read
concurrency:
  group: builder-conformance-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: harness
    env:
      CS5_SOURCE_REVISION: ${{ inputs.source_revision }}
      CS5_HARNESS_REVISION: ${{ vars.BUILDER_TRUSTED_HARNESS_REVISION }}
    steps:
      # This reviewed entrypoint itself must be dispatched/called at its owner
      # pinned revision. Nothing is checked out until protected policy validates.
      - name: Validate protected entrypoint, harness and approved source policy
        working-directory: ${{ github.workspace }}
        env:
          APPROVED_SOURCE: ${{ vars.BUILDER_APPROVED_SOURCE_REVISION }}
          ENTRYPOINT_REVISION: ${{ vars.BUILDER_TRUSTED_QUALIFICATION_REVISION }}
          ACTUAL_ENTRYPOINT: ${{ job.workflow_sha }}
          ACTUAL_ENTRYPOINT_REPOSITORY: ${{ job.workflow_repository }}
          ACTUAL_ENTRYPOINT_FILE: ${{ job.workflow_file_path }}
          TRUSTED_REPOSITORY: ${{ github.repository }}
          TRUSTED_WORKFLOW: ${{ vars.BUILDER_TRUSTED_BUILD_WORKFLOW }}
          TRUSTED_REVISION: ${{ vars.BUILDER_TRUSTED_BUILD_REVISION }}
          CANDIDATE_IMAGE: ${{ vars.BUILDER_CANDIDATE_IMAGE }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re
          e=os.environ
          for name in ('APPROVED_SOURCE','ENTRYPOINT_REVISION','CS5_HARNESS_REVISION','TRUSTED_REVISION'):
              if not re.fullmatch('[0-9a-f]{40}',e[name]): raise ValueError('protected SHA required: '+name)
          if e['ACTUAL_ENTRYPOINT'] != e['ENTRYPOINT_REVISION']: raise ValueError('unapproved qualification entrypoint')
          if e['CS5_SOURCE_REVISION'] != e['APPROVED_SOURCE']: raise ValueError('unapproved candidate source')
          repo=e['TRUSTED_REPOSITORY']
          if e['ACTUAL_ENTRYPOINT_REPOSITORY'] != repo or e['ACTUAL_ENTRYPOINT_FILE'] != '.github/workflows/builder-conformance.yml': raise ValueError('unapproved qualification repository/file')
          if e['TRUSTED_WORKFLOW'] != repo+'/.github/workflows/builder-candidate-build.yml': raise ValueError('protected build workflow required')
          if e['CANDIDATE_IMAGE'] != 'ghcr.io/'+repo.lower()+'-builder-candidate': raise ValueError('authorized isolated package required')
          policy=pathlib.Path(e['RUNNER_TEMP'])/'builder-build-policy.json'
          policy.write_text(json.dumps(dict(repository=repo,signer_workflow=e['TRUSTED_WORKFLOW'],signer_revision=e['TRUSTED_REVISION'],source_revision=e['APPROVED_SOURCE'],harness_revision=e['CS5_HARNESS_REVISION'],candidate_image=e['CANDIDATE_IMAGE'])))
          policy.chmod(0o600)
          with open(e['GITHUB_ENV'],'a') as env: env.write('CS5_BUILD_POLICY='+str(policy)+'\n')
          PY
      - name: Checkout separately pinned trusted harness only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.BUILDER_TRUSTED_HARNESS_REVISION }}
          path: harness
          persist-credentials: false
          submodules: false
          lfs: false
      - name: authenticate immutable index, both platform subjects and pulled config
        env:
          CANDIDATE_INDEX: ${{ inputs.candidate_index }}
          ARCHITECTURE: ${{ matrix.architecture }}
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/builder-read-registry
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/verify-builder-build-binding.py authenticate "$CS5_BUILD_POLICY" "$CANDIDATE_INDEX" "$CS5_SOURCE_REVISION" "$ARCHITECTURE" "$RUNNER_TEMP/verified-build.json"
          sudo install -m 0600 "$RUNNER_TEMP/verified-build.json" /run/dify-builder-verified-build.json
      - name: provision authenticated artifact with trusted harness and no token
        env:
          CANDIDATE_INDEX: ${{ inputs.candidate_index }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: scripts/builder-conformance-ci.sh provision "$CANDIDATE_INDEX" "$ARCHITECTURE"
      - name: Measure useful actual workloads
        run: |
          mkdir -p artifacts
          scripts/builder-conformance.sh --measure --output artifacts/budget-candidate.json
      - name: Freeze measured profile in a fresh owned generation
        run: scripts/builder-conformance-ci.sh freeze
      - name: Run all six groups and assemble unsigned release evidence
        run: scripts/builder-conformance.sh --verify --output artifacts/qualification.json
      - name: Retain bounded evidence
        if: always()
        run: |
          mkdir -p artifacts
          scripts/builder-conformance-ci.sh logs > artifacts/fixture.log 2>&1
          if sudo test -d /var/lib/dify-builder-ci/artifacts; then
            sudo cp -a /var/lib/dify-builder-ci/artifacts/. artifacts/
            sudo chown -R "$(id -u):$(id -g)" artifacts
          fi
          if sudo test -d /var/lib/dify-builder-ci/observations; then
            sudo cp -a /var/lib/dify-builder-ci/observations artifacts/final-observations
            sudo chown -R "$(id -u):$(id -g)" artifacts/final-observations
          fi
          if test -f "$RUNNER_TEMP/verified-build.json"; then
            cp "$RUNNER_TEMP/verified-build.json" artifacts/build-attestation.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: builder-conformance-${{ matrix.architecture }}
          path: harness/artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Tear down only this run's owned services and namespace
        if: always()
        run: scripts/builder-conformance-ci.sh cleanup
